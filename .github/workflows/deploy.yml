name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # workflow_run срабатывает и на CI из PR форков с веткой main — выкатываем только push в наш репозиторий.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      PREFIX: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Normalize image prefix
        run: echo "PREFIX=$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/python.Dockerfile
          push: true
          tags: ${{ env.PREFIX }}/bu-python:${{ env.TAG }},${{ env.PREFIX }}/bu-python:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ env.PREFIX }}/bu-web:${{ env.TAG }},${{ env.PREFIX }}/bu-web:latest
      - name: Sync deploy files and roll out
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null "$HOME/.ssh_key" && printf '%s\n' "$SSH_KEY" > "$HOME/.ssh_key"
          SSH="ssh -i $HOME/.ssh_key -o StrictHostKeyChecking=accept-new"
          rsync -az -e "$SSH" --exclude .env deploy/ "$VPS_USER@$HOST:/opt/bu-site/deploy/"
          # Пакеты GHCR приватные: сервер тянет образы токеном этого job'а (живёт, пока идёт job).
          printf '%s' "$GHCR_TOKEN" | $SSH "$VPS_USER@$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "$VPS_USER@$HOST" "/opt/bu-site/deploy/deploy.sh $TAG"
