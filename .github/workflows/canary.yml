name: Canary (join.football markup)
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: CANARY=1 uv run pytest -m canary -v
