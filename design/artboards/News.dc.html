<div style="font-family: Manrope, system-ui, sans-serif; color: #0A0A0A; background: #FFFFFF; min-height: 100%;">

<header style="background: #0A0A0A; color: #FFFFFF;">

<a href="Fantasy.dc.html" style="text-decoration: none; color: #FFFFFF;">Лига</a>
</nav>

<section>
<div style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 24px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: flex-end;">
<h1 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 700; font-size: 72px; line-height: 1; text-transform: uppercase;">Новости</h1>
<div role="group" aria-label="Фильтр по тегу" style="display: flex; flex-wrap: wrap; gap: 6px;">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 18px; background: #0A0A0A; color: #FFFFFF; border: 2px solid #0A0A0A; font-family: Oswald, sans-serif; font-weight: 600; font-size: 15px; text-transform: uppercase;">Все</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; background: #FFFFFF; color: #0A0A0A; border: 2px solid #0A0A0A; font-family: Oswald, sans-serif; font-size: 15px; text-transform: uppercase;">Матч</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; background: #FFFFFF; color: #0A0A0A; border: 2px solid #0A0A0A; font-family: Oswald, sans-serif; font-size: 15px; text-transform: uppercase;">Клуб</button>

<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; background: #FFFFFF; color: #0A0A0A; border: 2px solid #0A0A0A; font-family: Oswald, sans-serif; font-size: 15px; text-transform: uppercase;">Из соцсетей</button>
</div>
</div>
</section>

<!-- Главная новость -->
<section>
<div style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 48px;">
<a href="Match.dc.html" style="text-decoration: none; display: flex; flex-wrap: wrap; background: #0A0A0A; color: #FFFFFF;">
<div class="ph" style="flex: 3 1 520px; min-height: 420px;"></div>
<div style="flex: 2 1 360px; padding: 40px; display: flex; flex-direction: column; gap: 16px; justify-content: flex-end;">
<div style="display: flex; gap: 10px; align-items: center; font-size: 13px;"><span style="background: #FFFFFF; color: #0A0A0A; padding: 3px 8px; font-family: Oswald, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;">Матч</span><span style="color: #BDBDBD;">12 октября</span></div>
<h2 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 700; font-size: 48px; line-height: 1; text-transform: uppercase;">Дубль Смирнова и вторая строчка в таблице</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #D4D4D4;">[Лид отчёта в одно-два предложения.]</p>
<span style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase;">Читать →</span>
</div>
</a>
</div>
</section>

<!-- Лента -->
<section>
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px 56px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px 24px;">
<sc-for list="{{items}}" as="n" hint-placeholder-count="9">
<sc-if value="{{n.social}}" hint-placeholder-val="{{false}}">
<article style="border: 2px solid #0A0A0A; padding: 22px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;"><span style="display: flex; align-items: center; gap: 8px; font-family: Oswald, sans-serif; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 3 2 11l7 2 2 7 4-5 5 4z"/></svg>{{n.tag}}</span><span style="color: #525252;">{{n.date}}</span></div>
<p style="margin: 0; font-size: 17px; line-height: 1.55;">{{n.title}}</p>
<a href="#" style="margin-top: auto; font-size: 14px; font-weight: 700;">Открыть оригинал ↗</a>
</article>
</sc-if>
<sc-if value="{{n.regular}}" hint-placeholder-val="{{true}}">
<article style="display: flex; flex-direction: column; gap: 12px;">
<a href="#" aria-label="{{n.title}}" class="phl" style="display: block; aspect-ratio: 4 / 3;"></a>
<div style="display: flex; gap: 10px; align-items: center; font-size: 13px;"><span style="background: #0A0A0A; color: #FFFFFF; padding: 3px 8px; font-family: Oswald, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;">{{n.tag}}</span><span style="color: #525252;">{{n.date}}</span></div>
<h3 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.2; text-transform: uppercase;"><a href="#" style="text-decoration: none;">{{n.title}}</a></h3>
</article>
</sc-if>
</sc-for>
</div>
<nav aria-label="Страницы" style="max-width: 1280px; margin: 0 auto; padding: 0 32px 72px; display: flex; gap: 6px; justify-content: center;">
<a href="#" aria-current="page" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #0A0A0A; color: #FFFFFF; text-decoration: none; font-family: Oswald, sans-serif; font-weight: 600;">1</a>
<a href="#" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #0A0A0A; box-sizing: border-box; text-decoration: none; font-family: Oswald, sans-serif;">2</a>
<a href="#" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #0A0A0A; box-sizing: border-box; text-decoration: none; font-family: Oswald, sans-serif;">3</a>
<a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 16px; border: 2px solid #0A0A0A; box-sizing: border-box; text-decoration: none; font-family: Oswald, sans-serif; text-transform: uppercase;">Дальше →</a>
</nav>
</section>
<div class="stripes" aria-hidden="true" style="height: 8px; background-color: #0A0A0A;"></div>
</div>
</x-dc>
