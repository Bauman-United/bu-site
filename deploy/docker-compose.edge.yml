# Режим «чужой Caddy»: 80/443 на сервере уже занимает общий Caddy (сейчас — стек protein
# на bots_server), поэтому свои nginx и certbot не поднимаем. bu-web подключается к общей
# сети `edge`, а deploy.sh кладёт блок сайта в каталог, который Caddy импортирует
# (CADDY_SITES_DIR), и перечитывает его конфиг.
# В `edge` compose регистрирует контейнер под именем сервиса, поэтому туда подключаем только
# сервисы с уникальными именами: обычный `web` перехватил бы upstream `web:80` у protein.
# Включается в .env: COMPOSE_FILE=docker-compose.yml:docker-compose.edge.yml и NGINX_MODE=edge.
services:
  nginx:
    profiles: [nginx]
  certbot:
    profiles: [nginx]
  bu-web:
    networks: [default, edge]

networks:
  edge:
    external: true
