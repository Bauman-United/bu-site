[project]
name = "bu-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bu-core", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[tool.uv.sources]
bu-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bu_api"]
