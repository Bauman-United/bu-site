[project]
name = "bu-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "bu-core",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
]

[tool.uv.sources]
bu-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bu_worker"]
